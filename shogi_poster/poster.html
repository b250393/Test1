<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國學院大學将棋部 新歓ポスター</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #2a2a2a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
    }

    .poster {
      position: relative;
      width: 960px;
      height: 540px;
      overflow: hidden;
      background: linear-gradient(
        160deg,
        #f5ede0 0%,
        #e8d8c0 25%,
        #d4c4a8 50%,
        #c8b890 75%,
        #b8a87a 100%
      );
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    /* 障子・自然光の背景 */
    .shoji-bg {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.12) 0px,
          rgba(255, 255, 255, 0.12) 2px,
          transparent 2px,
          transparent 60px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.10) 0px,
          rgba(255, 255, 255, 0.10) 2px,
          transparent 2px,
          transparent 60px
        );
    }

    /* 障子からの光 */
    .light-bloom {
      position: absolute;
      top: 0;
      right: 120px;
      width: 420px;
      height: 380px;
      background: radial-gradient(
        ellipse at 60% 20%,
        rgba(255, 245, 220, 0.75) 0%,
        rgba(255, 235, 190, 0.40) 40%,
        transparent 75%
      );
      pointer-events: none;
    }

    /* 遠景：ビル群シルエット */
    .cityscape {
      position: absolute;
      bottom: 140px;
      right: 40px;
      width: 380px;
      height: 160px;
      opacity: 0.18;
    }

    .cityscape svg {
      width: 100%;
      height: 100%;
    }

    /* 神社・鳥居シルエット */
    .shrine {
      position: absolute;
      bottom: 130px;
      right: 110px;
      width: 180px;
      height: 130px;
      opacity: 0.28;
    }

    .shrine svg {
      width: 100%;
      height: 100%;
    }

    /* 畳の床 */
    .tatami {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 220px;
      background: linear-gradient(
        180deg,
        rgba(158, 140, 100, 0) 0%,
        rgba(158, 140, 100, 0.55) 30%,
        rgba(140, 122, 85, 0.80) 100%
      );
    }

    .tatami::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 88px,
          rgba(100, 80, 50, 0.15) 88px,
          rgba(100, 80, 50, 0.15) 92px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 44px,
          rgba(100, 80, 50, 0.10) 44px,
          rgba(100, 80, 50, 0.10) 46px
        );
    }

    /* 将棋盤 */
    .shogi-board-wrap {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .shogi-board {
      width: 180px;
      height: 160px;
      background: linear-gradient(145deg, #c8a055, #a07030, #8a5e20);
      border: 3px solid #6a4010;
      border-radius: 3px;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 1px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,200,100,0.3);
    }

    .shogi-cell {
      background: rgba(210, 170, 80, 0.35);
      border: 0.5px solid rgba(100, 60, 10, 0.4);
      border-radius: 1px;
    }

    /* 将棋の駒（シンボル） */
    .shogi-piece {
      position: absolute;
      font-size: 8px;
      color: #3a2000;
      font-weight: bold;
    }

    /* 人物：対局者エリア */
    .players-area {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    /* 女子学生（着物） */
    .player-female {
      width: 110px;
      height: 220px;
      position: relative;
    }

    .player-female svg {
      width: 100%;
      height: 100%;
    }

    /* 男子学生（着物/作務衣） */
    .player-male {
      width: 100px;
      height: 200px;
      position: relative;
    }

    .player-male svg {
      width: 100%;
      height: 100%;
    }

    /* ギャラリー学生 */
    .gallery {
      position: absolute;
      bottom: 55px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .gallery-left, .gallery-right {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .gallery-left {
      margin-left: 24px;
    }

    .gallery-right {
      margin-right: 24px;
    }

    .gallery-person {
      width: 60px;
      height: 150px;
      opacity: 0.88;
    }

    .gallery-person svg {
      width: 100%;
      height: 100%;
    }

    /* テキストエリア：上部 */
    .header-text {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 22px 40px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .club-name {
      font-size: 28px;
      font-weight: 900;
      color: #2a1a08;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 6px rgba(255,220,150,0.6);
      line-height: 1.2;
    }

    .club-name .university {
      font-size: 15px;
      display: block;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #4a2e0a;
      margin-bottom: 2px;
    }

    .catch-copy {
      font-size: 13px;
      color: #4a3010;
      text-align: right;
      line-height: 1.8;
      letter-spacing: 0.06em;
    }

    /* 朱色の帯装飾 */
    .accent-bar {
      position: absolute;
      top: 88px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(180, 40, 20, 0.55) 20%,
        rgba(200, 60, 30, 0.75) 50%,
        rgba(180, 40, 20, 0.55) 80%,
        transparent 100%
      );
    }

    /* フッター */
    .footer-text {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(50, 30, 10, 0.65);
      letter-spacing: 0.18em;
    }

    /* ぼかし・奥行き効果 */
    .depth-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 90%,
        transparent 40%,
        rgba(100, 80, 50, 0.12) 100%
      );
      pointer-events: none;
    }

    /* ビネット */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 50%,
        transparent 55%,
        rgba(30, 20, 10, 0.35) 100%
      );
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="poster">

    <!-- 背景：障子グリッド -->
    <div class="shoji-bg"></div>

    <!-- 自然光 -->
    <div class="light-bloom"></div>

    <!-- 遠景：ビル群シルエット -->
    <div class="cityscape">
      <svg viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg" fill="#4a5060">
        <rect x="0"   y="60"  width="28" height="100"/>
        <rect x="30"  y="30"  width="22" height="130"/>
        <rect x="54"  y="50"  width="18" height="110"/>
        <rect x="74"  y="10"  width="30" height="150"/>
        <rect x="106" y="40"  width="24" height="120"/>
        <rect x="132" y="20"  width="20" height="140"/>
        <rect x="154" y="55"  width="26" height="105"/>
        <rect x="182" y="5"   width="32" height="155"/>
        <rect x="216" y="35"  width="20" height="125"/>
        <rect x="238" y="50"  width="24" height="110"/>
        <rect x="264" y="15"  width="28" height="145"/>
        <rect x="294" y="45"  width="18" height="115"/>
        <rect x="314" y="30"  width="22" height="130"/>
        <rect x="338" y="60"  width="20" height="100"/>
        <rect x="360" y="70"  width="20" height="90"/>
      </svg>
    </div>

    <!-- 神社シルエット：鳥居 -->
    <div class="shrine">
      <svg viewBox="0 0 180 130" xmlns="http://www.w3.org/2000/svg" fill="#8b2020">
        <!-- 鳥居 -->
        <rect x="20"  y="30" width="6"  height="100"/>
        <rect x="154" y="30" width="6"  height="100"/>
        <rect x="10"  y="30" width="160" height="8"/>
        <rect x="20"  y="42" width="140" height="6"/>
        <!-- 社殿屋根 -->
        <polygon points="60,60 120,60 140,80 40,80" fill="#8b2020"/>
        <rect x="50" y="80" width="80" height="40"/>
        <!-- 屋根の端 -->
        <polygon points="50,60 130,60 150,55 30,55" fill="#6a1515"/>
      </svg>
    </div>

    <!-- 畳の床 -->
    <div class="tatami"></div>

    <!-- 将棋盤 -->
    <div class="shogi-board-wrap">
      <div class="shogi-board" id="shogi-board"></div>
    </div>

    <!-- ギャラリー学生（左：男子+女子） -->
    <div class="gallery">
      <div class="gallery-left">
        <!-- 男子学生1（きれいめカジュアル） -->
        <div class="gallery-person">
          <svg viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
            <!-- 頭 -->
            <ellipse cx="30" cy="18" rx="13" ry="15" fill="#f0c8a0"/>
            <!-- 黒髪 -->
            <ellipse cx="30" cy="10" rx="13" ry="9" fill="#2a2010"/>
            <!-- 笑顔 -->
            <circle cx="25" cy="19" r="1.5" fill="#5a3820"/>
            <circle cx="35" cy="19" r="1.5" fill="#5a3820"/>
            <path d="M25 24 Q30 28 35 24" stroke="#5a3820" stroke-width="1.2" fill="none"/>
            <!-- 体：ニット -->
            <rect x="17" y="33" width="26" height="50" rx="4" fill="#7a8fa0"/>
            <!-- 腕 -->
            <rect x="8"  y="33" width="10" height="36" rx="4" fill="#7a8fa0"/>
            <rect x="42" y="33" width="10" height="36" rx="4" fill="#7a8fa0"/>
            <!-- スラックス -->
            <rect x="17" y="82" width="11" height="58" rx="3" fill="#4a5060"/>
            <rect x="32" y="82" width="11" height="58" rx="3" fill="#4a5060"/>
            <!-- スニーカー -->
            <ellipse cx="22" cy="140" rx="9" ry="5" fill="#ddd"/>
            <ellipse cx="38" cy="140" rx="9" ry="5" fill="#ddd"/>
          </svg>
        </div>
        <!-- 女子大生1（スカート） -->
        <div class="gallery-person">
          <svg viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="30" cy="18" rx="12" ry="14" fill="#f5d0b0"/>
            <!-- 長髪 -->
            <ellipse cx="30" cy="10" rx="13" ry="9" fill="#1a1008"/>
            <rect x="18" y="10" width="5" height="40" rx="3" fill="#1a1008"/>
            <rect x="37" y="10" width="5" height="38" rx="3" fill="#1a1008"/>
            <!-- 笑顔 -->
            <circle cx="25" cy="18" r="1.5" fill="#5a3020"/>
            <circle cx="35" cy="18" r="1.5" fill="#5a3020"/>
            <path d="M25 23 Q30 27 35 23" stroke="#5a3020" stroke-width="1.2" fill="none"/>
            <!-- カーディガン -->
            <rect x="18" y="32" width="24" height="38" rx="4" fill="#d8c0d0"/>
            <!-- トップス -->
            <rect x="20" y="32" width="20" height="38" rx="3" fill="#f0e0f0"/>
            <!-- スカート（フレア） -->
            <path d="M15 70 Q10 110 8 140 L52 140 Q50 110 45 70 Z" fill="#e8d0e8"/>
            <!-- 靴 -->
            <ellipse cx="20" cy="141" rx="8" ry="5" fill="#c8a0b0"/>
            <ellipse cx="40" cy="141" rx="8" ry="5" fill="#c8a0b0"/>
          </svg>
        </div>
      </div>

      <div class="gallery-right">
        <!-- 女子大生2（スカート） -->
        <div class="gallery-person">
          <svg viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="30" cy="18" rx="12" ry="14" fill="#f5d0b0"/>
            <ellipse cx="30" cy="10" rx="13" ry="9" fill="#3a2510"/>
            <rect x="18" y="10" width="4" height="35" rx="3" fill="#3a2510"/>
            <rect x="38" y="10" width="4" height="33" rx="3" fill="#3a2510"/>
            <circle cx="25" cy="18" r="1.5" fill="#5a3020"/>
            <circle cx="35" cy="18" r="1.5" fill="#5a3020"/>
            <path d="M25 23 Q30 27 35 23" stroke="#5a3020" stroke-width="1.2" fill="none"/>
            <!-- トップス（淡い色） -->
            <rect x="18" y="32" width="24" height="38" rx="4" fill="#c8d8e8"/>
            <!-- スカート（Aライン） -->
            <path d="M16 70 Q12 108 10 140 L50 140 Q48 108 44 70 Z" fill="#b8c8e0"/>
            <ellipse cx="20" cy="141" rx="8" ry="5" fill="#9090c0"/>
            <ellipse cx="40" cy="141" rx="8" ry="5" fill="#9090c0"/>
          </svg>
        </div>
        <!-- 男子学生2（シャツ+スラックス） -->
        <div class="gallery-person">
          <svg viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="30" cy="18" rx="13" ry="15" fill="#f0c8a0"/>
            <ellipse cx="30" cy="10" rx="13" ry="9" fill="#1e1810"/>
            <circle cx="25" cy="19" r="1.5" fill="#5a3820"/>
            <circle cx="35" cy="19" r="1.5" fill="#5a3820"/>
            <path d="M25 24 Q30 28 35 24" stroke="#5a3820" stroke-width="1.2" fill="none"/>
            <!-- シャツ -->
            <rect x="17" y="33" width="26" height="50" rx="4" fill="#e8e0d0"/>
            <rect x="8"  y="33" width="10" height="36" rx="4" fill="#e8e0d0"/>
            <rect x="42" y="33" width="10" height="36" rx="4" fill="#e8e0d0"/>
            <!-- スラックス -->
            <rect x="17" y="82" width="11" height="58" rx="3" fill="#606878"/>
            <rect x="32" y="82" width="11" height="58" rx="3" fill="#606878"/>
            <ellipse cx="22" cy="140" rx="9" ry="5" fill="#c8c8c8"/>
            <ellipse cx="38" cy="140" rx="9" ry="5" fill="#c8c8c8"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 対局者：女子学生（着物） -->
    <div style="position:absolute; bottom:62px; left:calc(50% - 195px); width:120px; height:240px;">
      <svg viewBox="0 0 120 240" xmlns="http://www.w3.org/2000/svg">
        <!-- 黒髪（まとめ髪） -->
        <ellipse cx="60" cy="22" rx="20" ry="22" fill="#f5d0b0"/>
        <ellipse cx="60" cy="12" rx="20" ry="14" fill="#1a1008"/>
        <ellipse cx="80" cy="18" rx="8"  ry="6"  fill="#1a1008"/>
        <!-- かんざし -->
        <line x1="80" y1="12" x2="96" y2="6" stroke="#c8a030" stroke-width="2"/>
        <circle cx="96" cy="6" r="3" fill="#e8c040"/>
        <!-- 顔 -->
        <ellipse cx="60" cy="26" rx="16" ry="18" fill="#f5d0b0"/>
        <!-- 目（細め、穏やか） -->
        <path d="M50 24 Q54 21 58 24" stroke="#3a2010" stroke-width="1.5" fill="none"/>
        <path d="M62 24 Q66 21 70 24" stroke="#3a2010" stroke-width="1.5" fill="none"/>
        <!-- ほほえみ -->
        <path d="M53 33 Q60 38 67 33" stroke="#c07060" stroke-width="1.5" fill="rgba(220,130,110,0.3)"/>
        <!-- 着物（淡い色：薄紫系） -->
        <path d="M38 46 L50 44 L60 48 L70 44 L82 46 L85 120 L35 120 Z" fill="#d8c8e8"/>
        <!-- 着物の衿 -->
        <path d="M50 44 L60 70 L70 44" stroke="#f0f0f0" stroke-width="3" fill="none"/>
        <!-- 帯 -->
        <rect x="40" y="100" width="40" height="18" rx="2" fill="#9a7080"/>
        <!-- 袖 -->
        <path d="M38 46 L15 80 L25 90 L42 60" fill="#d8c8e8"/>
        <path d="M82 46 L105 80 L95 90 L78 60" fill="#d8c8e8"/>
        <!-- 下半身（着物） -->
        <path d="M35 120 Q30 180 32 240 L88 240 Q90 180 85 120 Z" fill="#c8b8d8"/>
        <!-- 手（駒を持つ） -->
        <ellipse cx="38" cy="88" rx="7" ry="5" fill="#f5d0b0"/>
        <ellipse cx="42" cy="95" rx="6" ry="4" fill="#f5d0b0"/>
      </svg>
    </div>

    <!-- 対局者：男子学生（作務衣） -->
    <div style="position:absolute; bottom:62px; left:calc(50% + 75px); width:110px; height:220px;">
      <svg viewBox="0 0 110 220" xmlns="http://www.w3.org/2000/svg">
        <!-- 頭 -->
        <ellipse cx="55" cy="22" rx="18" ry="20" fill="#f0c8a0"/>
        <ellipse cx="55" cy="12" rx="18" ry="12" fill="#2a2010"/>
        <!-- 目（真剣な表情） -->
        <ellipse cx="47" cy="22" rx="3" ry="2.5" fill="#3a2010"/>
        <ellipse cx="63" cy="22" rx="3" ry="2.5" fill="#3a2010"/>
        <!-- 少しの笑み -->
        <path d="M48 31 Q55 35 62 31" stroke="#7a4020" stroke-width="1.2" fill="none"/>
        <!-- 作務衣（落ち着いた紺色） -->
        <path d="M35 44 L45 42 L55 46 L65 42 L75 44 L78 110 L32 110 Z" fill="#3a4860"/>
        <!-- 衿 -->
        <path d="M45 42 L55 62 L65 42" stroke="#f0f0f0" stroke-width="2" fill="none"/>
        <!-- 袖 -->
        <path d="M35 44 L16 72 L24 80 L38 56" fill="#3a4860"/>
        <path d="M75 44 L94 72 L86 80 L72 56" fill="#3a4860"/>
        <!-- ズボン -->
        <rect x="32" y="108" width="20" height="102" rx="3" fill="#2a3848"/>
        <rect x="58" y="108" width="20" height="102" rx="3" fill="#2a3848"/>
        <!-- 手 -->
        <ellipse cx="74" cy="80" rx="7" ry="5" fill="#f0c8a0"/>
      </svg>
    </div>

    <!-- テキストエリア -->
    <div class="header-text">
      <div class="club-name">
        <span class="university">國學院大學</span>
        将棋部
      </div>
      <div class="catch-copy">
        一手に、想いを込めて。<br/>
        伝統と出会う、新しい自分。
      </div>
    </div>

    <!-- 朱色アクセントライン -->
    <div class="accent-bar"></div>

    <!-- フッター -->
    <div class="footer-text">
      ＊ 新入生大歓迎 ＊　体験入部随時受付中　＊　詳細はSNS・掲示板にて
    </div>

    <!-- 奥行きオーバーレイ -->
    <div class="depth-overlay"></div>
    <!-- ビネット -->
    <div class="vignette"></div>

  </div>

  <script>
    // 将棋盤のマス目（9×9 = 81マス）をプログラムで生成
    const board = document.getElementById('shogi-board');
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('div');
      cell.className = 'shogi-cell';
      fragment.appendChild(cell);
    }
    board.appendChild(fragment);
  </script>
</body>
</html>
